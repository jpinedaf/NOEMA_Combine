# Naming-only example showing the three supported spectral-unit conventions.
# Copy the [project], [folders], [catalogues], and other operational sections
# from config_raw_scripts.ini for a complete project configuration.

[project]
base_dir = /path/to/project

[naming]
root = .

# Select exactly one of these folder templates for a project.
# One-window lower-case folder: l10
# narrowband_folder = {root}/{config}/{lid_folder}

# One-window upper-case folder: L10
# narrowband_folder = {root}/{config}/narrowband/{lid_upper}

# Paired-window folder: l10l49
narrowband_folder = {root}/{config}/{lid_pair}
