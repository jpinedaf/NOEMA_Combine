# Configuration example for projects using the directory and naming style
# used by the files in raw_scripts/.

[project]
# All relative folder and catalogue paths are resolved from this directory.
base_dir = /path/to/project

[folders]
# These folders are retained for existing package operations. The naming
# templates below define the raw-script-style products.
uvt_dir = uvts
uvt_dir_out = merged_uvts
dir_sd = 30m
inputdir = raw_data, additional_data

[catalogues]
line_catalogue = catalogues/line_catalogue_3mm.csv
source_catalogue = catalogues/region_catalogue.yml

[file_handling]
# Add project-specific exclusions as needed.
# ignorefiles_1 = raw_data/bad_scan.30m

[file_extensions]
selfcal = _sc
uvsub = _contsub

[single_dish]
telescope = iram30m

[gildas]
# Commands execute by default. Set execute = false to only generate scripts.
execute = true
workdir = .
setup =
setup_file =
interactive = false
shell = /bin/bash
class = class
mapping = mapping
clic = clic

[continuum_subtraction]
# If a window has no configured range, generated scripts use: uv_baseline 0
wideband_lo = 0 25 96 96 248 275
wideband_li = 0 20 69 73 397 403
wideband_ui = 0 50 95 96 160 190
wideband_uo = 0 30 439 461 921 931

[narrowband_channel_ranges]
l009l048 = 0 20 100 260 1004 1024
l012l051 = 0 20 80 170 1004 1024

[narrowband]
windows = l009l048, l010l049, l011l050

[imaging]
wideband_windows = lo, li, ui, uo
include_narrowband = true

[cleaning]
weighting = natural
threshold_factor = 5
niter = 0
primary_beam_correction = true
primary_beam_truncate = 20

[naming]
# The root value is resolved relative to [project] base_dir.
root = .

# Dirty-image inputs and products. The suffix variables allow the same
# workflow to process raw, self-calibrated, continuum-subtracted, or
# self-calibrated continuum-subtracted UVTs.
dirty_folder = {root}/{config}/{window_folder}
dirty_input = {dirty_folder}/{source}_{config}_{window}{selfcal}{contsub}.uvt
dirty_script = {dirty_folder}/{source}_{config}_{window}{selfcal}{contsub}_dirty.map
dirty_map = {dirty_folder}/{source}_{config}_{window}{selfcal}{contsub}.lmv
clean_input = {root}/{config}/wideband/{source}_{config}_{window}{selfcal}{contsub}.uvt
clean_script = {root}/{config}/wideband/{source}_{config}_{window}{selfcal}{contsub}_clean.map
clean_cube = {root}/{config}/wideband/{source}_{config}_{window}{selfcal}{contsub}.lmv-clean
clean_fits = {root}/{config}/wideband/{source}_{config}_{window}{selfcal}{contsub}.fits
clean_pb_cube = {root}/{config}/wideband/{source}_{config}_{window}{selfcal}{contsub}-pbcor.lmv-sky
clean_pb_fits = {root}/{config}/wideband/{source}_{config}_{window}{selfcal}{contsub}-pbcor.fits
clean_input_narrowband = {root}/{config}/{lid_pair_folder}/{source_out}_{config}_{lid_pair_filename}{selfcal}{contsub}.uvt
clean_script_narrowband = {root}/{config}/{lid_pair_folder}/{source_out}_{config}_{lid_pair_filename}{selfcal}{contsub}_clean.map
clean_cube_narrowband = {root}/{config}/{lid_pair_folder}/{source_out}_{config}_{lid_pair_filename}{selfcal}{contsub}.lmv-clean
clean_fits_narrowband = {root}/{config}/{lid_pair_folder}/{source_out}_{config}_{lid_pair_filename}{selfcal}{contsub}.fits
clean_pb_cube_narrowband = {root}/{config}/{lid_pair_folder}/{source_out}_{config}_{lid_pair_filename}{selfcal}{contsub}-pbcor.lmv-sky
clean_pb_fits_narrowband = {root}/{config}/{lid_pair_folder}/{source_out}_{config}_{lid_pair_filename}{selfcal}{contsub}-pbcor.fits

# UV restoration products. The same operation supports continuum images and
# cubes; the _line templates are used with product_type = "line".
restore_uvt = {root}/{config}/wideband/{source}_{config}_{window}{selfcal}{contsub}.uvt
restore_cct = {root}/{config}/wideband/{source}_{config}_{window}{selfcal}{contsub}.cct
restore_clean = {root}/{config}/wideband/{source}_{config}_{window}{selfcal}{contsub}.lmv-clean
restore_output = {root}/{config}/wideband/{source}_{config}_{window}{selfcal}{contsub}_uvres.lmv-clean
restore_fits = {root}/{config}/wideband/{source}_{config}_{window}{selfcal}{contsub}_uvres.fits
restore_pb_cube = {root}/{config}/wideband/{source}_{config}_{window}{selfcal}{contsub}_uvres-pbcor.lmv-sky
restore_pb_fits = {root}/{config}/wideband/{source}_{config}_{window}{selfcal}{contsub}_uvres-pbcor.fits
restore_script = {root}/{config}/wideband/{source}_{config}_{window}{selfcal}{contsub}_restore.map
restore_uvt_narrowband = {root}/{config}/{lid_pair_folder}/{source_out}_{config}_{lid_pair_filename}{selfcal}{contsub}.uvt
restore_cct_narrowband = {root}/{config}/{lid_pair_folder}/{source_out}_{config}_{lid_pair_filename}{selfcal}{contsub}.cct
restore_clean_narrowband = {root}/{config}/{lid_pair_folder}/{source_out}_{config}_{lid_pair_filename}{selfcal}{contsub}.lmv-clean
restore_output_narrowband = {root}/{config}/{lid_pair_folder}/{source_out}_{config}_{lid_pair_filename}{selfcal}{contsub}_uvres.lmv-clean
restore_fits_narrowband = {root}/{config}/{lid_pair_folder}/{source_out}_{config}_{lid_pair_filename}{selfcal}{contsub}_uvres.fits
restore_pb_cube_narrowband = {root}/{config}/{lid_pair_folder}/{source_out}_{config}_{lid_pair_filename}{selfcal}{contsub}_uvres-pbcor.lmv-sky
restore_pb_fits_narrowband = {root}/{config}/{lid_pair_folder}/{source_out}_{config}_{lid_pair_filename}{selfcal}{contsub}_uvres-pbcor.fits
restore_script_narrowband = {root}/{config}/{lid_pair_folder}/{source_out}_{config}_{lid_pair_filename}{selfcal}{contsub}_restore.map
restore_uvt_line = {root}/{config}/{lid_pair_folder}/{source_out}_{config}_{line}_{qn}_{lid_pair_filename}{selfcal}{contsub}.uvt
restore_cct_line = {root}/{config}/{lid_pair_folder}/{source_out}_{config}_{line}_{qn}_{lid_pair_filename}{selfcal}{contsub}.cct
restore_clean_line = {root}/{config}/{lid_pair_folder}/{source_out}_{config}_{line}_{qn}_{lid_pair_filename}{selfcal}{contsub}.lmv-clean
restore_output_line = {root}/{config}/{lid_pair_folder}/{source_out}_{config}_{line}_{qn}_{lid_pair_filename}{selfcal}{contsub}_uvres.lmv-clean
restore_fits_line = {root}/{config}/{lid_pair_folder}/{source_out}_{config}_{line}_{qn}_{lid_pair_filename}{selfcal}{contsub}_uvres.fits
restore_pb_cube_line = {root}/{config}/{lid_pair_folder}/{source_out}_{config}_{line}_{qn}_{lid_pair_filename}{selfcal}{contsub}_uvres-pbcor.lmv-sky
restore_pb_fits_line = {root}/{config}/{lid_pair_folder}/{source_out}_{config}_{line}_{qn}_{lid_pair_filename}{selfcal}{contsub}_uvres-pbcor.fits
restore_script_line = {root}/{config}/{lid_pair_folder}/{source_out}_{config}_{line}_{qn}_{lid_pair_filename}{selfcal}{contsub}_restore.map

# Wideband UVT products.
uvt_file = {root}/{config}/wideband/{source}_{config}_{lid_upper}_{line}_{qn}{selfcal}{contsub}.uvt
uvt_file_merge = {root}/{config}30m/{source}_{config}_{lid_upper}_{line}_{qn}{selfcal}{contsub}.uvt
uvt_window = {root}/{config}/wideband/{source}_{config}_{lid_upper}{selfcal}{uvsub}.uvt

# Narrowband products can use {lid_pair_folder} for folders and
# {lid_pair_filename} for zero-padded filenames.
narrowband_folder = {root}/{config}/{lid_pair_folder}

# Products used by later imaging and line-cube workflows.
continuum_file = {root}/{config}/wideband/{source}_{config}_{lid_upper}_continuum.uvt
continuum_subtracted_file = {root}/{config}/wideband/{source}_{config}_{lid_upper}{contsub}.uvt
clean_image = {root}/{config}/images/{source}_{config}_{lid_upper}{suffix}.fits
line_cube = {root}/{config}30m/{source}_{line}_{qn}_{lid_lower}{suffix}.fits
merged_cube = {root}/{config}30m/{source}_{line}_{qn}_{lid_lower}{suffix}.fits
mask_file = {root}/{config}/masks/{source}_{config}_{lid_upper}{suffix}.mask
uvfits_file = {root}/{config}/uvfits/{source}_{config}_{lid_upper}.uvfits

# Search patterns may contain wildcards. They are used to find products made
# by older scripts and are not used as output filenames.
search_uvt = {root}/{config}/**/{source}*{lid}*{line}*{qn}*.uvt
